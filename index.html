    let currentDecade = 'all';

    function render() {
      const container = document.getElementById('albumContainer');
      const kw = document.getElementById('searchInput').value.trim().toLowerCase();
      container.innerHTML = '';
      let totalAlbums = 0, totalPhotos = 0;

      DATA.forEach((sec) => {
        if (currentDecade !== 'all' && sec.decade !== currentDecade) return;
        const matched = sec.items.filter(item =>
          !kw || item.d.toLowerCase().includes(kw) || item.l.toLowerCase().includes(kw) || sec.title.toLowerCase().includes(kw)
        );
        if (matched.length === 0) return;

        totalAlbums++;
        totalPhotos += matched.length;

        const secDiv = document.createElement('div');
        secDiv.className = 'section-box';
        secDiv.innerHTML = `
          <div class="section-title" onclick="this.parentElement.classList.toggle('collapsed')">
            <span>📍 ${sec.title}</span>
          </div>
          <div class="card-list">
            ${matched.map(it => `
              <div class="card" data-u="${it.u}" onclick="openViewer(this)">
                <div class="card-header">
                  <span class="card-label">${it.l}</span>
                  <span class="link-badge">사진 보기 ▾</span>
                </div>
                <div class="card-desc">${it.d || '추억 사진'}</div>
              </div>
            `).join('')}
          </div>
        `;
        container.appendChild(secDiv);
      });

      document.getElementById('resultInfo').textContent = `표시 중: ${totalAlbums}개 앨범 · 총 ${totalPhotos.toLocaleString()}장의 추억`;
    }

    function openViewer(card) {
      const panel = document.getElementById('viewerPanel');
      const wrap = document.querySelector('.sticky-wrap');
      panel.style.top = Math.ceil(wrap.getBoundingClientRect().bottom) + 'px';
      const old = panel.querySelector('iframe');
      if (old) old.remove();
      const f = document.createElement('iframe');
      f.src = card.dataset.u;
      panel.insertBefore(f, panel.firstChild);
      panel.classList.add('open');
      document.body.style.overflow = 'hidden';
      if (!panelPushed) { history.pushState({viewer: 1}, ''); panelPushed = true; }
    }

    let panelPushed = false;
    window.addEventListener('popstate', function () {
      panelPushed = false;
      closeViewer();
    });

    function closeViewer() {
      document.getElementById('viewerPanel').classList.remove('open');
      const f = document.querySelector('#viewerPanel iframe');
      if (f) f.remove();
      document.body.style.overflow = '';
    }

    function selectDecade(dec, btn) {
      currentDecade = dec;
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      render();
    }

    function applyFilters() { render(); }
    render();
  </script>
